<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgroManage - Management Dashboard</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <header class="header">
    <section class="container header-container">
      <h1 class="logo">🌱 AgroManage</h1>

        <a href="index.html" class="btn btn-secondary">Keluar</a>
      </nav>
    </section>
  </header>

  <main class="container">
    <section class="card-table" aria-label="Tabel Kelola Data Lahan">
    <header class="table-header-responsive">
      <h2>Kelola Inventaris Lahan</h2>
      <section class="table-header-actions">
        <input type="search" id="searchInput" placeholder="Cari data..." style="padding: 0.5rem 0.8rem; border: 1px solid #ccc; border-radius: 4px; font-size: 0.88rem;">
        <a href="tambah_data.html" class="btn btn-primary" style="background-color: var(--primary); color: white; text-decoration: none;">+ Tambah Data Lahan</a>
      </section>
    </header>
      
      <figure style="overflow-x: auto; margin: 0;">
        <table class="table">
          <thead>
            <tr>
              <th scope="col">No</th>
              <th scope="col">Nama Blok Lahan</th>
              <th scope="col">Lokasi / Wilayah</th>
              <th scope="col">Luas Area (m²)</th>
              <th scope="col">Komoditas Tanaman</th>
              <th scope="col">Tanggal Tanam</th>
              <th scope="col">Status Vegetasi</th>
              <th scope="col">Aksi</th>
            </tr>
          </thead>
          <tbody id="lahanTableBody">
          </tbody>
        </table>
      </figure>
    </section>

</main>

  <footer class="footer">
    <section class="container">
      <p style="font-size: 0.85rem; color: #9ca3af;">&copy; 2026 AgroManage</p>
    </section>
  </footer>

  <script type="module" src="assets/js/dashboardapp.js"></script>
</body>
</html>
