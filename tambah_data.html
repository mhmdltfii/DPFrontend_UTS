<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgroManage - Form Input Data Lahan</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <!-- Header Navigasi -->
  <header class="header">
    <section class="container header-container">
      <h1 class="logo">🌱 AgroManage</h1>
      
        <a href="index.html" class="btn btn-secondary">Keluar</a>
      </nav>
    </section>
  </header>

  <main class="container">
    <article class="card-table" style="margin-bottom: 2rem;">
      <header style="margin-bottom: 1.5rem; border-bottom: 1px solid #eee; padding-bottom: 0.75rem;">
        <h2 id="formTitle" style="color: var(--primary);">Form Input Data Lahan</h2>
        <p style="color: #6b7280; font-size: 0.9rem;">Isi formulir di bawah ini untuk menambahkan atau memperbarui inventaris lahan.</p>
      </header>

      <form id="lahanForm">
        <input type="hidden" id="lahanId">

        <section class="stats-grid" style="grid-template-columns: repeat(2, 1fr); gap: 1rem; margin-bottom: 1rem;">
          <p>
            <label for="namaLahan" style="display: block; font-weight: 600; margin-bottom: 0.3rem;">Nama Blok Lahan</label>
            <input type="text" id="namaLahan" placeholder="Contoh: Blok Subak A" style="width: 100%; padding: 0.6rem; border: 1px solid #ccc; border-radius: 4px;">
          </p>

          <p>
            <label for="lokasi" style="display: block; font-weight: 600; margin-bottom: 0.3rem;">Lokasi / Wilayah</label>
            <input type="text" id="lokasi" placeholder="Contoh: Kabat, Banyuwangi" style="width: 100%; padding: 0.6rem; border: 1px solid #ccc; border-radius: 4px;">
          </p>

          <p>
            <label for="luas" style="display: block; font-weight: 600; margin-bottom: 0.3rem;">Luas Area (m²)</label>
            <input type="number" id="luas" placeholder="Contoh: 2500" style="width: 100%; padding: 0.6rem; border: 1px solid #ccc; border-radius: 4px;">
          </p>

          <p>
            <label for="jenisTanaman" style="display: block; font-weight: 600; margin-bottom: 0.3rem;">Komoditas Tanaman</label>
            <input type="text" id="jenisTanaman" placeholder="Contoh: Padi Inpari 32" style="width: 100%; padding: 0.6rem; border: 1px solid #ccc; border-radius: 4px;">
          </p>

          <p>
            <label for="tanggalTanam" style="display: block; font-weight: 600; margin-bottom: 0.3rem;">Tanggal Tanam</label>
            <input type="date" id="tanggalTanam" style="width: 100%; padding: 0.6rem; border: 1px solid #ccc; border-radius: 4px;">
          </p>

          <p>
            <label for="statusLahan" style="display: block; font-weight: 600; margin-bottom: 0.3rem;">Status Vegetasi</label>
            <select id="statusLahan" style="width: 100%; padding: 0.6rem; border: 1px solid #ccc; border-radius: 4px;">
              <option value="Masa Tanam">Masa Tanam</option>
              <option value="Siap Panen">Siap Panen</option>
              <option value="Pengolahan Tanah">Pengolahan Tanah</option>
              <option value="Status Bera">Status Bera</option>
            </select>
          </p>
        </section>

        <fieldset style="border: 1px dashed #2e7d32; background: #f0fdf4; border-radius: 6px; padding: 1rem; margin-bottom: 1.5rem;">
          <legend style="padding: 0 0.5rem; font-weight: bold; color: var(--primary);">Live Preview Input</legend>
          <p style="font-size: 0.9rem; color: #374151;">
            <strong>Nama:</strong> <span id="prevNamaLahan">-</span> | 
            <strong>Lokasi:</strong> <span id="prevLokasi">-</span> | 
            <strong>Luas:</strong> <span id="prevLuas">-</span> | 
            <strong>Komoditas:</strong> <span id="prevJenisTanaman">-</span> | 
            <strong>Tgl Tanam:</strong> <span id="prevTanggalTanam">-</span> | 
            <strong>Status:</strong> <span id="prevStatusLahan">-</span>
          </p>
        </fieldset>

        <footer style="display: flex; gap: 0.5rem;">
          <button type="submit" id="btnSubmit" class="btn btn-primary" style="background-color: var(--primary); color: white;">Simpan Data</button>
          <a href="dashboard.html" class="btn btn-secondary">Batal / Kembali</a>
        </footer>
      </form>
    </article>
  </main>

  <footer class="footer">
    <section class="container">
      <p style="font-size: 0.85rem; color: #9ca3af;">&copy; 2026 AgriManage System</p>
    </section>
  </footer>

  <script type="module" src="assets/js/dashboardapp.js"></script>
</body>
</html>
