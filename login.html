<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgroManage - Login Portal</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body style="display: flex; flex-direction: column; min-height: 100vh; background-color: var(--bg-color);">

  <main style="flex: 1; display: flex; justify-content: center; align-items: center; padding: 1rem;">
    <article style="background: white; padding: 2rem; border-radius: 8px; box-shadow: var(--shadow); width: 100%; max-width: 380px;">
      <header style="text-align: center; margin-bottom: 1.5rem;">
        <h1 style="color: var(--primary); font-size: 1.8rem;">🌱 AgroManage</h1>
        <p style="color: #666; font-size: 0.9rem;">Masukkan akun untuk mengakses sistem</p>
      </header>

      <form id="loginForm">
        <p style="margin-bottom: 1rem;">
          <label for="username" style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.3rem;">Username</label>
          <input type="text" id="username" name="username" placeholder="Masukkan username" style="width: 100%; padding: 0.6rem; border: 1px solid #ccc; border-radius: 4px;">
        </p>

        <p style="margin-bottom: 1rem; position: relative;">
          <label for="password" style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.3rem;">Password</label>
          <input type="password" id="password" name="password" placeholder="Masukkan password" style="width: 100%; padding: 0.6rem 2.5rem 0.6rem 0.6rem; border: 1px solid #ccc; border-radius: 4px;">

          <button type="button" id="togglePassword" aria-label="Tampilkan Password" style="position: absolute; right: 8px; top: 28px; background: none; border: none; cursor: pointer; font-size: 1.1rem; padding: 0.2rem; color: #666;">
            👁️
          </button>
        </p>

        <p id="errorMessage" role="alert" style="color: #d32f2f;
        background-color: #ffebee; border: 1px solid #ffcdd2;
        padding: 0.5rem; border-radius: 4px; font-size: 0.85rem;
        text-align: center; margin-bottom: 1rem; display: none;"></p>

        <button type="submit" class="btn btn-primary" style="width: 100%;
        background-color: var(--primary); color: white; padding: 0.7rem;
        font-weight: bold;">Masuk</button>
      </form>
    </article>
  </main>

  <footer class="footer" style="margin-top: 0; padding: 1rem 0;">
    <section class="container">
      <p style="font-size: 0.85rem; color: #9ca3af;">&copy; 2026 AgroManage System</p>
    </section>
  </footer>

  <script type="module" src="assets/js/loginapp.js"></script>
</body>
</html>
